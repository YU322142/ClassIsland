name: Build LoongArch old-world ABI1.0 package

on:
  workflow_dispatch:
    inputs:
      branch:
        description: ClassIsland branch to package
        required: true
        default: develop/v2/misha-alpha
      avaloniaVersion:
        description: Avalonia version used by the dynamic patch
        required: true
        default: 12.0.4
  push:
    branches:
      - develop/v2/misha-alpha
      - develop/v2/misha-alpha-ci
    paths:
      - tools/loongarch-oldworld/**
      - .github/workflows/build-loongarch-oldworld.yml

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download online native libraries
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_DOWNLOAD_TOKEN || github.token }}
        run: |
          tools/loongarch-oldworld/Get-OnlineNativeAssets.ps1 `
            -OutputDir "$env:GITHUB_WORKSPACE\artifacts\loongarch-oldworld\online-native" `
            -Wait `
            -TimeoutMinutes 180

      - name: Package ClassIsland
        shell: pwsh
        env:
          API_SIGNING_KEY: ${{ secrets.API_SIGNING_KEY }}
          API_SIGNING_KEY_PS: ${{ secrets.API_SIGNING_KEY_PS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $branch = "${{ github.event.inputs.branch }}"
          if ([string]::IsNullOrWhiteSpace($branch)) {
            $branch = "${{ github.ref_name }}"
          }
          $avaloniaVersion = "${{ github.event.inputs.avaloniaVersion }}"
          if ([string]::IsNullOrWhiteSpace($avaloniaVersion)) {
            $avaloniaVersion = "12.0.4"
          }
          tools/loongarch-oldworld/Build-ClassIsland-LoongArchOldWorld.ps1 `
            -RepoUrl "https://github.com/${{ github.repository }}.git" `
            -Branches $branch `
            -SourceMode git `
            -AvaloniaVersion $avaloniaVersion `
            -NativeAssetsDir "$env:GITHUB_WORKSPACE\artifacts\loongarch-oldworld\online-native"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-linux-loongarch64-oldworld
          path: |
            artifacts/loongarch-oldworld/out/*.tar.gz
          if-no-files-found: error
